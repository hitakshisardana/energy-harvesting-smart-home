# Energy constants for the simulator. Single source of truth — no energy
# number belongs in Python code.
#
# EVERY value carries a `src` tag. Do not add a line without one.
#   MEASURED    bench measurement, with date + method
#   DATASHEET   from a part datasheet, with the part named
#   DERIVED     computed from other lines here
#   PLACEHOLDER literature-typical guess. MUST be replaced in Phase 1a.
#   SWEPT       not a constant. Run the experiment across the whole range and
#               report sensitivity. Never quote a single value from these.
#
# Units: millijoules (mJ) everywhere. Never volts, never percent.
# `stored_energy_pct` in the MQTT schema is a rendering of e_max_mj, not a unit.

meta:
  version: 2
  trace: hh104
  notes: >
    Event rates are measured from data/processed/events_hh104.parquet
    (61 days, 127,840 events). Everything else is placeholder until Phase 1a.
  changed_in_v2: >
    Four corrections, all found by reading each note against its own value:
      1. gym_session 1500 -> 180000 mJ. The value came from a "150 mW for 10 s"
         hand-crank note but the session is declared as 20 minutes, implying
         1.25 mW average. The node the file claimed "dominates by 2-3 orders of
         magnitude" was harvesting about the same as ambient.
      2. sim.e_init_fraction 0.5 -> 0.0. The key was DEAD (storage.py hardcoded
         0.5) and a half-full 60,000 mJ cell let a starved node coast ~90 days,
         reporting capture = 1.000 for a harvester delivering 3.6 mJ/day.
      3. storage gains C_lithium and a sweep axis, after a capacitance sweep
         showed supercapacitors have a hard ceiling (see that block).
      4. door events_per_day energy figure corrected: 3.6 mJ/day, not 7.5.
    sim.py now returns `sustainable`, `burn_in_days` and `run_long_enough`.
    Check all three before quoting any number from a run.

# ---------------------------------------------------------------------------
# 1. THE PARAMETER THAT DECIDES THE PROJECT
# ---------------------------------------------------------------------------
# A CASAS motion-ON event is a PRESENCE DETECTION, not a footstep. One person
# crossing the kitchen fires one event and takes some unknown number of steps.
# Harvest scales with steps, not with events.
#
# At 1x the floor node is dead. At ~3x it clears its own overhead. At 10x it is
# comfortable. Nobody has measured it. Treat it as the independent variable of
# the whole study, not as a constant to be picked.
transduction:
  footsteps_per_visit:
    src: SWEPT
    range: [5, 10, 20, 40, 80]
    default: 20
    note: >
      Applies to VISITS, not raw sensor events. A PIR re-triggers ~1 Hz while
      someone is present, so raw event count measures presence, not motion --
      the floor node fires ~32 events per 34 s visit. Multiplying raw events
      by a per-event factor overestimated floor harvest by ~16x and made dead
      nodes look alive. Events are debounced into visits (see harvesting.py,
      DEBOUNCE_S) before this multiplier is applied.
      MUST appear as a sensitivity axis in every energy result.
      Visits are built by harvesting.to_visits: by=node is a lower bound on
      walkers, by=zone an upper bound (see docs/findings.md F5).

  debounce_s:
    src: SWEPT
    range: [30, 60, 120]
    default: 60
    note: gap above which two detections count as separate visits. Sweep it.

  compressions_per_furniture_event:
    src: SWEPT
    range: [1, 2, 5]
    default: 2
    # also applies per visit, not per raw event
    note: sleep_presence events are re-triggers of a sleeper shifting position.

  flybys_per_door_event:
    src: DERIVED
    value: 1
    note: >
      One door opening is one magnet flyby. No multiplier applies here, which
      is why the door node cannot be rescued by transduction assumptions.

# ---------------------------------------------------------------------------
# 2. HARVEST — energy reaching the store, per primitive event
# ---------------------------------------------------------------------------
harvest:
  efficiency:
    rectifier:
      src: PLACEHOLDER
      value: 0.55
      note: >
        Full-wave bridge on a high-impedance piezo loses two diode drops
        against a low-current source. Schottky or active rectification does
        better. MEASURE.
    pmic:
      src: PLACEHOLDER
      value: 0.60
      note: >
        BQ25504-class. The binding constraint is COLD START (~600 mV, ~15 uW),
        not steady-state efficiency. A piezo delivering only short spikes may
        never cold-start at all. Test from a fully drained cap.

  per_event_raw_mj:
    footstep:
      # DERIVED, no longer a guess. Body mass is from data; delta and eta are
      # assumptions and are SWEPT below. Model: src/gait_energy.py.
      #   F_peak = k * m * g          k = 1.20 MEASURED (Horst et al. 2017 raw trials)
      #   E_mech = 1/2 * F_peak * delta
      #   E_elec = E_mech * eta       this is raw piezo output, BEFORE the
      #                               rectifier x PMIC chain below
      # Source data: Horst et al. (2017), Gait & Posture 58:476-480, CC BY 4.0,
      # https://data.mendeley.com/datasets/yrpbd8fhc4/1 (128 subjects, 1278 trials).
      # Value = population median at delta=2 mm, eta=0.03. Population 5-95%:
      # 18-32 mJ. Published floor tiles: 11 mJ (<50 kg), 32 mJ (>70 kg).
      # VALIDATION: range matched; mass ratio NOT matched (model 1.89, published
      # 2.91). See docs/findings.md. The sweep, not this value, is the result.
      src: DERIVED
      value: 25.3
      note: >
        Derived as above. Nothing here was bench-measured. If the published tile
        figures are DELIVERED energy rather than raw piezo output, the model
        under-predicts by about 3x (rectifier 0.55 x PMIC 0.60).
    compression:
      src: PLACEHOLDER
      value: 0.25
      note: slower strain rate than a footstep, expect less.
    door_flyby:
      src: PLACEHOLDER
      value: 0.40
      note: depends on magnet strength, coil turns, door speed.
    gym_session:
      src: PLACEHOLDER
      value: 180000.0
      note: >
        150 mW sustained for the full 20-minute session declared in
        nodes.yaml (0.15 W x 1200 s = 180 J). CORRECTED: this was 1500 mJ,
        which came from a "~150 mW for 10 s" hand-crank figure that was never
        reconciled with the 20-minute session length -- it implied 1.25 mW
        average, less than a nightlight, and made the gym node roughly equal
        to ambient instead of dominating. If the intended device really is a
        hand crank, change session_minutes in nodes.yaml instead; the two
        files must agree.
        150 mW is conservative for a generator attachment on equipment a
        person drives at 50-150 W mechanical -- it assumes well under 1%
        capture. MEASURE before quoting.
        Consequence to keep in view: one session delivers ~59,400 mJ after
        efficiency into a 440.6 mJ store, so over 99% overflows and is
        wasted. The gym node is not storage-limited by its harvest but by
        its capacitor. Report gym separately; never let it into an average.

  # Inputs to the footstep DERIVED value above (src/gait_energy.py). Assumed,
  # not measured. Energy is linear in both.
  tile_deflection_mm:
    src: SWEPT
    range: [1, 2, 3]
    default: 2
    note: Compliant-surface deflection under a footstep.
  piezo_coupling:
    src: SWEPT
    range: [0.01, 0.02, 0.03, 0.05]
    default: 0.03
    note: Fraction of mechanical energy converted to electrical (1-5 % for piezo).

  # Occupancy-INDEPENDENT source. Untested, and the most important open
  # question in the design: every real source in hh104 is correlated with
  # occupancy, so none of them harvest during the silence the others face.
  indoor_pv_uw:
    src: SWEPT
    range: [0, 10, 30, 50, 100, 200]
    default: 30
    note: >
      Average output under room light while lit. Simulation shows the weak
      nodes cross from dead to alive between 10 and 50 uW, so this range must
      be swept, not fixed. A few cm2 of indoor PV at typical room light is
      plausibly tens of uW. MEASURE with the actual cell and room.
    daylight_hours_per_day:
      src: PLACEHOLDER
      value: 12

# ---------------------------------------------------------------------------
# 3. TASK COSTS — ESP32-C3, mJ per operation
# ---------------------------------------------------------------------------
# Derived as I(mA) * t(ms) * 3.3 V / 1000. All currents DATASHEET-typical;
# measure yours with a shunt + scope or a power profiler.
tasks:
  rail_voltage_v: {src: PLACEHOLDER, value: 3.3}

  occ_sense_mj:   {src: PLACEHOLDER, value: 3.894, note: wake + PIR/FSR read + count update}
  env_sense_mj:   {src: PLACEHOLDER, value: 2.442, note: wake + BME280 forced-mode + I2C read}
  door_sense_mj:  {src: PLACEHOLDER, value: 1.122, note: GPIO-interrupt wake + reed read}
  alarm_mj:       {src: PLACEHOLDER, value: 28.05, note: detect + local indicator pulse}

  tx_ble_mj:      {src: PLACEHOLDER, value: 3.086, note: one advertisement}
  tx_espnow_mj:   {src: PLACEHOLDER, value: 7.755, note: one packet, no association}
  tx_wifi_mj:
    src: PLACEHOLDER
    value: 789.0
    note: >
      Association + DHCP + MQTT connect + publish. ~100x an ESP-NOW packet.
      At the measured floor-node rate this is TEN DAYS of harvest for one
      transmission. Nodes must not speak MQTT directly — route via a
      mains-powered gateway over ESP-NOW/BLE. The interface schema is
      unaffected; only the node-to-gateway hop changes.

# ---------------------------------------------------------------------------
# 4. STORAGE
# ---------------------------------------------------------------------------
# Usable energy = 0.5 * C * (Vmax^2 - Vmin^2). Vmin is the regulator dropout,
# NOT zero: charge below it exists but cannot be spent.
#
# WHICH OPTION IS SELECTED CHANGES THE PROJECT'S CONCLUSION. Do not switch it
# without rerunning every experiment and checking the `sustainable` and
# `run_long_enough` fields sim.py now returns.
storage:
  selected: A_low_leak

  options:
    A_low_leak:
      src: PLACEHOLDER
      capacitance_f: 0.047
      v_max: 5.0
      v_min_usable: 2.5
      e_max_mj: 440.6
      leak_ua: 1.0
      note: >
        Smaller and low-leakage. Currently selected because it is the part the
        design assumed, NOT because it was shown to be best.

    B_standard:
      src: PLACEHOLDER
      capacitance_f: 0.10
      v_max: 5.0
      v_min_usable: 2.5
      e_max_mj: 937.5
      leak_ua: 5.0
      note: More reserve, but 5x the leakage. Usually a net loss on weak nodes.

    C_lithium:
      src: PLACEHOLDER
      v_max: 5.0
      e_max_mj: 60000.0
      leak_ua: 0.0926
      note: >
        UNTESTED CANDIDATE, not selected. ~17 mWh rechargeable coin cell.
        `leak_ua` here is NOT a capacitor leakage current: it is the equivalent
        current that reproduces ~2 %/month self-discharge (~40 mJ/day) through
        the same formula the other options use, so storage.py needs no change.
        Label it as self-discharge, never as leakage, when reporting.

        WHY IT IS HERE. Sweeping supercapacitance found a hard ceiling: leakage
        scales with C (~21 uA/F implied by option A, ~50 uA/F by option B --
        these disagree by 2.3x and neither is measured), so a store big enough
        to hold one 20-minute exercise session (~6.4 F) leaks ~58,800 mJ/day
        against ~34,000 mJ/day of harvest (4 sessions/week x 59,400 mJ). It consumes more than it captures.
        At 3.6 F the node captures ~13,000 mJ/day more than at 0.047 F and
        delivers LESS to tasks (446 vs 512 mJ/day) because ~14,700 mJ/day leaks
        away. Cell self-discharge scales with stored ENERGY, not capacitance,
        so it has no such crossover.

        DO NOT ADOPT WITHOUT RESOLVING:
          1. Cycle life. Four charge bursts a week for years is a duty cycle
             supercapacitors tolerate and small cells may not. Not modelled.
          2. Sustainability. A cell removes leakage; it does not create
             harvest. With leakage gone, standing overhead is still ~285
             mJ/day of MCU sleep, and floor (113.6 mJ/day at the old 0.6 mJ placeholder, pv=0) still does
             not break even. Only gym, at ~34,000 mJ/day, clearly does.
          3. The earlier result showing capture = 1.000 for every node on this
             option was an ARTIFACT of e_init_fraction = 0.5, i.e. 30,000 mJ
             of free starting charge. Fixed; see sim.e_init_fraction below.

  # Sweep the capacity axis rather than picking a value. See F5 in
  # docs/findings.md: for a bursty source, storage and not harvest is binding.
  sweep_e_max_mj:
    src: SWEPT
    range: [440.6, 937.5, 4688, 18750, 60000]

# ---------------------------------------------------------------------------
# 5. STANDING OVERHEAD — runs 24/7 whether or not the node ever senses
# ---------------------------------------------------------------------------
# THIS IS THE FIRST THING TO ATTACK. On placeholder values, leakage plus sleep
# exceeds what every real node except gym harvests in a day. Until overhead
# sits below daily harvest, the scheduler has nothing to allocate and no ML
# layer can help.
#
# The member-3 brief's placeholder of "0.1 %/hour of E_max" works out to ~22
# mJ/day. A real supercapacitor at 5 uA burns ~2160 mJ/day — roughly 100x
# more. Do not use the brief's figure.
overhead:
  leakage_mj_per_day:
    src: DERIVED
    formula: leak_ua * 1e-6 * v_max * 86400 * 1000
    at_selected: 432.0
    note: Worst case, computed at V max. Real leakage falls after soak. MEASURE.

  mcu_sleep_ua:
    src: SWEPT
    range: [0.5, 1.0, 5.0]
    default: 1.0
    note: >
      ESP32-C3 deep sleep is ~5 uA typical = ~1426 mJ/day, against a floor node
      harvesting ~240 mJ/day. The MCU is ~6x over budget before doing any work.
      Dev boards are far worse than the bare module (regulators, USB-UART
      bridge, power LED). Either strip the board, move to a sub-uA MCU class,
      or make the node transient-powered with no persistent state at all.
  mcu_sleep_mj_per_day:
    src: DERIVED
    formula: mcu_sleep_ua * 1e-6 * rail_voltage_v * 86400 * 1000
    at_default: 285.1

# ---------------------------------------------------------------------------
# 6. MEASURED EVENT RATES — from events_hh104.parquet, 61 days
# ---------------------------------------------------------------------------
# These are the only MEASURED numbers in this file. They are event rates, not
# energy: multiply by the transduction factors in section 1.
nodes:
  floor:
    src: MEASURED
    events_per_day: 1205.2
    event_type: motion
    frac_time_silent: 0.708
    silence_p99_over_median: 14.0
    note: >
      The only node with heavy-tailed silence (night median 240 min vs day 30
      min). A constant reserve must be sized for the 12 h tail while the
      typical case needs 45 min — which is exactly the condition where a
      forecast-driven reserve can win. The reserve claim is a FLOOR-NODE claim.

  ambient:
    src: MEASURED
    events_per_day: 550.8
    event_type: motion
    frac_time_silent: 0.624
    silence_p99_over_median: 5.7
    note: Regular silence. Expect a tuned constant reserve to match a forecast.

  furniture:
    src: MEASURED
    events_per_day: 287.4
    event_type: [motion, sleep_presence]
    frac_time_silent: 0.668
    silence_p99_over_median: 5.33
    note: >
      Harvests from the COMPRESSION source only: lounge-chair motion and
      bedroom sleep presence. Chair-motion events were previously harvested as
      footsteps, which inflated furniture to ~3,100 mJ/day. Under the
      compression source it is ~7.6 mJ/day against 717 mJ/day of overhead:
      DEAD. Chair motion covers 13.7 % of the windows where floor/door/ambient
      are all silent, so furniture is not the anti-correlated night source the
      original design assumed.
      DATA_NOTES.md and silence_analysis.py have both been corrected; do not
      let the old claim back in from the plan document.

  door:
    src: MEASURED
    events_per_day: 52.3
    event_type: door
    frac_time_silent: 0.759
    silence_p99_over_median: 6.0
    note: >
      DEAD ON REAL DATA. 6.4 mJ/day measured at placeholder conversion
      (door openings are not debounced: each is one magnet flyby), against
      717 mJ/day of overhead — a ~110x shortfall.
      No transduction multiplier applies to door flybys, so unlike the motion
      nodes it cannot be rescued by assuming more steps per visit. Neither
      storage option helps: at 55 days with an empty start it is in outage
      100 % of the time on both. Re-scope as a transient, unpowered,
      event-triggered reporter with no store and no sleep current, or drop it.
      A starved node measures starvation, not policy — run.py excludes it.

  gym:
    src: SYNTHETIC
    sessions_per_week: 4
    session_minutes: 20
    note: >
      No CASAS equivalent. Trace is generated in silence_analysis.py,
      conditioned on real hh104 occupancy so it cannot produce sessions while
      the home is empty. Its silence statistics are small-sample noise (~35
      sessions) — do not quote them. Adding gym changes coverage silence by
      0.000 across four seeds, because every gym-active window is already
      covered by a real node. Report gym only as a labelled ablation.
      CAPACITOR-LIMITED, NOT HARVEST-LIMITED. At the corrected session energy
      it harvests ~34,000 mJ/day and discards 96 % of it: one session delivers
      ~59,400 mJ after efficiency into a 440.6 mJ store. On the supercapacitor
      it still sits in outage 85 % of the time, because the energy arrives in
      four bursts a week and cannot be carried to the days between. On
      C_lithium the same node reaches 1.000 capture and 1 % outage. It is the
      only node for which the storage choice is the binding constraint.

# ---------------------------------------------------------------------------
# 7. SIMULATOR
# ---------------------------------------------------------------------------
sim:
  timestep_s: {src: PLACEHOLDER, value: 60}
  forecast_window_min:
    src: DERIVED
    value: 15
    note: >
      M2 forecasts at 15 min; the simulator steps at 60 s — 15x finer. Write
      down how a coarse forecast maps onto fine-grained decisions BEFORE
      building the RL environment around it.
  e_init_fraction:
    src: PLACEHOLDER
    value: 0.0
    note: >
      Fraction of capacity the node starts with. 0.0 = a freshly installed node
      that has not harvested anything yet.
      WAS 0.5, and was DEAD -- storage.py hardcoded 0.5 and never read this key.
      Harmless for a 440 mJ supercapacitor, fatal for a 60,000 mJ cell: the node
      began with 30,000 mJ of free energy and coasted ~90 days, so a 20-day run
      reported capture = 1.000 for a door node harvesting 6.4 mJ/day against
      ~325 mJ/day of overhead. The same node over 55 days gives 0.232 capture
      and 62 % outage. sim.py now reads this key and returns `sustainable`,
      `burn_in_days` and `run_long_enough` so the trap is visible in the output.
      Identical across all schedulers compared.
  seeds: {src: PLACEHOLDER, value: 5, note: report mean +/- std; single runs are not evidence}
  primary_metric:
    value: critical_event_capture_rate_during_silence
    note: One metric. Reward, MILP objective and headline plot all target it.
  secondary_metrics: [detections_reported, information_latency, reserve_violations, energy_wasted_overflow]